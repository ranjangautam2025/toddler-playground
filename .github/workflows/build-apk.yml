name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no wrapper JAR, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME is preset).
      - name: Build
        run: gradle --no-daemon assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: toddler-playground-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
